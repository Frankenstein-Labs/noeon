# Audited skill sources for the Noeon catalog.
#
# mode = "import"    content is fetched at the pinned commit, hashed, scanned and
#                    stored in the registry; installs re-verify the hash.
# mode = "reference" the repository is audited and its skill count recorded, but no
#                    content is imported (licence, aggregation or provenance limits).
#
# Only MIT, Apache-2.0 and BSD sources are imported. Copyleft or unlicensed sources
# stay reference-only; they are never copied into Noeon.

