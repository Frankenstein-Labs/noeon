[project]
name = "noeon"
version = "0.1.0"
description = "Noeon autonomous software engineering engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
openhands = ["openhands-sdk>=1.64.1", "openhands-tools>=1.64.1"]
api = ["fastapi>=0.115", "uvicorn>=0.34"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.8"]

[project.scripts]
noeon = "noeon.cli:main"
noeon-skills = "noeon.skills.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/noeon"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
